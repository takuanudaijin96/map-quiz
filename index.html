<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>地図クイズ教材</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
body { margin:0; font-family:"Yu Gothic",sans-serif; background:#f7f7f7; }
#map { height:45vh; border-bottom:1px solid #ccc; }
.screen { padding:12px; }
.hidden { display:none; }
h3 { margin:4px 0 10px; padding-bottom:6px; border-bottom:2px solid #4a90e2; }
button { width:100%; margin:6px 0; padding:10px; font-size:16px; border-radius:8px; border:none; background:#4a90e2; color:white; }
button.secondary { background:#aaa; }
button.choice { background:#2ecc71; }
select,input { width:100%; margin:6px 0; padding:8px; font-size:16px; border-radius:6px; border:1px solid #ccc; }
.card { background:white; border-radius:10px; padding:10px; margin:8px 0; box-shadow:0 2px 5px rgba(0,0,0,0.08); }
</style>
</head>
<body>
<div id="map"></div>

<!-- メニュー -->
<div class="screen" id="menu">
  <h3>地図クイズ</h3>
  <button onclick="switchMode('play')">▶ 解答モード</button>
  <button class="secondary" onclick="switchMode('create')">⚙ 作問モード（教師）</button>
</div>

<!-- 解答モード 章選択 -->
<div class="screen hidden" id="chapterScreen">
  <h3>章を選択</h3>
  <select id="chapterSelect"></select>
  <button onclick="toDifficulty()">次へ</button>
  <button class="secondary" onclick="show('menu')">戻る</button>
</div>

<!-- 難易度選択 -->
<div class="screen hidden" id="difficultyScreen">
  <h3>難易度</h3>
  <select id="difficultySelectPlay">
    <option value="all">全て</option>
    <option value="1">★</option>
    <option value="2">★★以上</option>
    <option value="3">★★★</option>
  </select>
  <button onclick="startQuiz()">開始</button>
  <button class="secondary" onclick="show('chapterScreen')">戻る</button>
</div>

<!-- クイズ画面 -->
<div class="screen hidden" id="quizScreen">
  <div class="card">
    <strong id="chapterLabel"></strong>
    <div id="progressText"></div>
    <div id="scoreText"></div>
  </div>
  <div class="card" id="questionText">この場所は？</div>
  <div id="choices"></div>
  <button onclick="showHint()">ヒント</button>
  <div id="hintArea"></div>
</div>

<!-- 結果画面 -->
<div class="screen hidden" id="resultScreen">
  <h3>結果</h3>
  <div id="resultScore"></div>
  <h4>正解した問題</h4>
  <ul id="correctList"></ul>
  <h4>間違えた問題</h4>
  <ul id="wrongList"></ul>
  <button onclick="show('menu')">メニューに戻る</button>
</div>

<!-- 作問モード -->
<div class="screen hidden" id="createMenu">
  <h3>作問モード</h3>
  <button onclick="show('createNew')">新規作問</button>
  <button onclick="showCreateList()">問題一覧</button>
  <button onclick="show('createChapter')">章の地図設定</button>
  <button onclick="downloadJSON()">JSON出力（共有用）</button>
  <button class="secondary" onclick="show('menu')">戻る</button>
</div>

<!-- 新規作問 -->
<div class="screen hidden" id="createNew">
  <h3>新規作問</h3>
  <input id="chapterInput" placeholder="章名">
  <select id="difficultyCreate">
    <option value="1">★</option>
    <option value="2">★★</option>
    <option value="3">★★★</option>
  </select>
  <input id="answerInput" placeholder="正解">
  <input id="c1" placeholder="選択肢1">
  <input id="c2" placeholder="選択肢2">
  <input id="c3" placeholder="選択肢3">
  <input id="h1" placeholder="ヒント1">
  <input id="h2" placeholder="ヒント2">
  <button onclick="addQuestion()">保存</button>
  <button class="secondary" onclick="show('createMenu')">戻る</button>
</div>

<!-- 問題一覧 -->
<div class="screen hidden" id="createList">
  <h3>問題一覧</h3>
  <select id="listChapterSelect" onchange="updateList()">
    <option value="">章を選択</option>
  </select>
  <div id="questionList"></div>
  <button class="secondary" onclick="show('createMenu')">戻る</button>
</div>

<!-- 章の地図設定 -->
<div class="screen hidden" id="createChapter">
  <h3>章の地図設定</h3>
  <input id="chapterViewInput" placeholder="章名">
  <button onclick="saveChapterView()">保存</button>
  <button class="secondary" onclick="show('createMenu')">戻る</button>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
let map = L.map("map").setView([35,135],4);

// 作問モード：川だけ表示タイル
let riverTile = L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_only_water/{z}/{x}/{y}{r}.png",
  { attribution:'&copy; OSM contributors &copy; CARTO', subdomains:'abcd', maxZoom:20 }
);

// 解答モード：ラベルなし
let noLabelTile = L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png",
  { attribution:'&copy; OSM contributors &copy; CARTO', subdomains:'abcd', maxZoom:20 }
);
noLabelTile.addTo(map);

// データ
let questions = [];
let chapters = JSON.parse(localStorage.getItem("chapters")||"{}");
let progress = JSON.parse(localStorage.getItem("progress")||"{}");

let currentChapter="", quiz=[], index=0, hintIdx=0, marker, tempLatLng;
let correctQuestions=[], wrongQuestions=[];

function saveProgress(){ localStorage.setItem("progress",JSON.stringify(progress)); }

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  map.invalidateSize();
}

// モード切替
function switchMode(mode){
  if(mode==="create"){
    show("createMenu"); // 画面を先に表示
    map.removeLayer(noLabelTile); riverTile.addTo(map);
    setTimeout(()=>map.invalidateSize(),100); // 再描画
    updateListChapterSelect();
  } else {
    show("chapterScreen");
    map.removeLayer(riverTile); noLabelTile.addTo(map);
    setTimeout(()=>map.invalidateSize(),100);
    updateChapterSelect();
  }
}

// 作問クリック
map.on("click",e=>{
  if(!document.getElementById("createNew").classList.contains("hidden")){
    tempLatLng=e.latlng;
    if(marker) marker.remove();
    marker=L.marker(e.latlng).addTo(map);
  }
});

// 作問保存
function addQuestion(){
  if(!tempLatLng) return alert("地図をクリック");
  questions.push({
    chapter: chapterInput.value,
    difficulty: +difficultyCreate.value,
    answer: answerInput.value,
    choices: [c1.value,c2.value,c3.value],
    hints: [h1.value,h2.value],
    lat: tempLatLng.lat,
    lng: tempLatLng.lng
  });
  alert("保存しました");
  chapterInput.value=""; difficultyCreate.value="1"; answerInput.value="";
  c1.value=""; c2.value=""; c3.value=""; h1.value=""; h2.value="";
  tempLatLng=null; if(marker){ marker.remove(); marker=null; }
}

// 章選択更新
function updateChapterSelect(){
  chapterSelect.innerHTML="";
  [...new Set(questions.map(q=>q.chapter))].forEach(c=>{
    let o=document.createElement("option"); o.value=o.textContent=c; chapterSelect.appendChild(o);
  });
}

function updateListChapterSelect(){
  listChapterSelect.innerHTML='<option value="">章を選択</option>';
  [...new Set(questions.map(q=>q.chapter))].forEach(c=>{
    let o=document.createElement("option"); o.value=o.textContent=c; listChapterSelect.appendChild(o);
  });
}

// 問題一覧表示
function showCreateList(){
  show("createList");
  updateListChapterSelect();
  listChapterSelect.value="";
  questionList.innerHTML="";
}

// 問題リスト更新
function updateList(){
  const selectedChapter = listChapterSelect.value;
  questionList.innerHTML="";
  if(!selectedChapter) return;
  questions.forEach((q,i)=>{
    if(q.chapter!==selectedChapter) return;
    let d=document.createElement("div");
    d.className="card";
    d.textContent=`${q.chapter} ★${q.difficulty} ${q.answer}`;
    let b=document.createElement("button");
    b.textContent="削除";
    b.onclick=()=>{ 
      if(confirm("削除しますか？")){
        questions.splice(i,1);
        updateList();
        updateListChapterSelect();
      }
    };
    d.appendChild(b);
    questionList.appendChild(d);
  });
}

// JSON出力
function downloadJSON(){
  if(questions.length===0){ alert("まだ問題がありません！"); return; }
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(questions,null,2));
  const dlAnchor = document.createElement('a');
  dlAnchor.setAttribute("href",dataStr);
  dlAnchor.setAttribute("download","questions.json");
  dlAnchor.click();
  alert("questions.json をダウンロードしました。友達と共有可能です。");
}

// 章の地図保存
function saveChapterView(){
  chapters[chapterViewInput.value]={center:map.getCenter(),zoom:map.getZoom()};
  localStorage.setItem("chapters",JSON.stringify(chapters));
  alert("章の地図設定を保存しました");
}

window.onload=()=>show("menu");
</script>
</body>
</html>
